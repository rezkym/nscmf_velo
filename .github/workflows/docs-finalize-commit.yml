name: Temporary Docs Finalize Commit

on:
  push:
    branches:
      - docs/finalize-project-documentation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run validated documentation transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/docs-freeze-audit.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'PY')
          block = src[start + 1:end]
          nonempty = [line for line in block if line.strip()]
          indent = min(len(line) - len(line.lstrip()) for line in nonempty)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in block) + '\n'
          Path('/tmp/finalize_docs.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/finalize_docs.py
          git add AGENTS.md project_doc
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m 'docs: freeze approved implementation baseline'
          git push origin HEAD:docs/finalize-project-documentation
