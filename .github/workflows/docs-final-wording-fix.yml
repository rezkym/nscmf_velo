name: Temporary Final Documentation Wording Fix

on:
  push:
    branches:
      - docs/finalize-project-documentation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize remaining wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changes = {
              '05_State_Status_Flow.md': [
                  ('# PART M — DOWNSTREAM / ACCEPTANCE', '# PART M — MATERIALIZATION / ACCEPTANCE'),
                  ('## 38. Technical Items Deferred to ERD/API', '## 38. Technical Materialization — Defined by ERD/API\n\nThe physical representations below are already governed by `11_ERD_Database_Schema.md` and `12_API_Contract.md`; this state-flow document defines their lifecycle meaning rather than duplicating those contracts.'),
              ],
              '07_UI_UX_Specification.md': [
                  ('## 73. Still Refinable / TBD', '## 73. Non-Blocking UI Tuning / Future Refinements\n\nThese items are not blockers for implementation and MUST NOT be guessed into new product requirements. Apply existing locked behavior first; refine only when evidence or explicit approval requires it.'),
              ],
              '11_ERD_Database_Schema.md': [
                  ('# PART W — INTENTIONALLY DEFERRED / NOT INVENTED HERE', '# PART W — NON-SCHEMA / IMPLEMENTATION-TIME VALUES'),
              ],
              '12_API_Contract.md': [
                  ('# PART AA — REMAINING API-ADJACENT TBDs', '# PART AA — NON-BLOCKING IMPLEMENTATION-TIME / FUTURE VALUES'),
              ],
              '13_Project_Structure.md': [
                  ('`Service → MalwareScanner → ClamAvScanner → clamd`. Topology deferred to Environment/Deployment; explicit CLEAN semantics fixed.', '`Service → MalwareScanner → ClamAvScanner → clamd`. Placement follows `20`: Docker `clamd` for local Phase 6 and private same-server `clamd` for the default future native server; explicit CLEAN semantics remain fixed.'),
              ],
              '14_Environment_Specification.md': [
                  ('34. silently select signer provider/library/path/rotation mechanism while upstream still leaves it unresolved;', '34. silently select a concrete signer library/key-container/path/rotation mechanism before the applicable Phase 8 dependency/security decision is approved;'),
              ],
              '17_Seed_Dummy_Data_Specification.md': [
                  ('# PART U — RELATIONSHIP TO DOCUMENTS 01–16', '# PART U — RELATIONSHIP TO OTHER PROJECT AUTHORITIES'),
              ],
          }
          root = Path('project_doc')
          for name, replacements in changes.items():
              p = root / name
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise AssertionError(f'{name}: expected wording not found: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          joined = '\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*.md'))
          for stale in [
              'Technical Items Deferred to ERD/API',
              'Still Refinable / TBD',
              'Topology deferred to Environment/Deployment',
              'while upstream still leaves it unresolved',
              'RELATIONSHIP TO DOCUMENTS 01–16',
          ]:
              assert stale not in joined, stale
          print('FINAL WORDING NORMALIZATION PASSED')
          PY
          git add project_doc
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m 'docs: normalize final non-blocking wording'
          git push origin HEAD:docs/finalize-project-documentation
