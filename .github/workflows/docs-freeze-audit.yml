name: Temporary Docs Freeze Finalizer

on:
  push:
    branches:
      - docs/finalize-project-documentation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize and verify project documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          docdir = root / 'project_doc'
          fixed = sorted(docdir.glob('[0-9][0-9]_*.md'))
          assert len(fixed) == 20, f'Expected 20 fixed-order docs, found {len(fixed)}'
          assert [p.name[:2] for p in fixed] == [f'{i:02d}' for i in range(1, 21)]

          final_notice = (
              'Fixed-order project documentation is complete and **Approved for Implementation** through '
              '`20_Deployment_Architecture.md`.\n\n'
              'Current project handoff: implementation follows `19_Task_Implementation_Plan.md`, beginning with '
              '**Phase 0 / T00** only after explicit user instruction.\n\n'
              'This document remains authoritative for its own concern and may only be changed through an explicit, '
              'synchronized, approved requirement change.'
          )

          def replace_next_handoff_blocks(text: str) -> str:
              lines = text.splitlines()
              out = []
              i = 0
              heading_re = re.compile(r'^##\s+(\d+)\.\s+(Next Fixed-Order Document|Next Document)\s*$', re.I)
              boundary_re = re.compile(r'^(---|##\s+\d+\.|# PART\b|#\s+\d+\.)', re.I)
              while i < len(lines):
                  line = lines[i]
                  hm = heading_re.match(line)
                  if hm:
                      out.append(f'## {hm.group(1)}. Documentation Finality / Current Handoff')
                      out.append('')
                      out.extend(final_notice.splitlines())
                      i += 1
                      while i < len(lines) and not boundary_re.match(lines[i]):
                          i += 1
                      continue

                  low = line.lower()
                  if ('next fixed-order document' in low or
                      'next document in the fixed project sequence' in low):
                      while out and out[-1] == '':
                          out.pop()
                      if out and re.search(r'Documents through .* exist|Documents through .* already exist', out[-1], re.I):
                          out.pop()
                      if out and out[-1] != '':
                          out.append('')
                      out.extend(final_notice.splitlines())
                      i += 1
                      while i < len(lines) and not boundary_re.match(lines[i]):
                          i += 1
                      continue

                  out.append(line)
                  i += 1
              return '\n'.join(out).rstrip() + '\n'

          for p in fixed:
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'^> \*\*Status:\*\*.*$',
                  '> **Status:** Approved for Implementation  ',
                  text,
                  count=1,
                  flags=re.M,
              )
              assert count == 1, f'Missing unique Status header in {p}'
              text = re.sub(
                  r'^> \*\*Last Updated:\*\*.*$',
                  '> **Last Updated:** 2026-09-02  ',
                  text,
                  count=1,
                  flags=re.M,
              )

              temporal_replacements = {
                  'confirmed decisions for upcoming `14_Environment_Specification.md`': '`14_Environment_Specification.md`',
                  'upcoming `14_Environment_Specification.md`': '`14_Environment_Specification.md`',
                  '`14_Environment_Specification.md` once created': '`14_Environment_Specification.md`',
                  '`15_Coding_Rules_AGENTS.md` once explicitly created': '`15_Coding_Rules_AGENTS.md`',
                  'Environment Specification → upcoming runtime/environment operationalization;': 'Environment Specification → runtime/environment operationalization;',
                  '`14` Environment once created.': '`14` Environment.',
                  'The fixed-order authoritative draft set is complete:': 'The fixed-order authoritative documentation set is complete and approved for implementation:',
                  '## 40. Relationship / Next Document': '## 40. Relationship / Documentation Handoff',
              }
              for old, new in temporal_replacements.items():
                  text = text.replace(old, new)

              text = replace_next_handoff_blocks(text)
              p.write_text(text, encoding='utf-8')

          # 10 — integrate final ClamAV/deployment/signing interpretation directly.
          p = docdir / '10_Security_Rules.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Exact same-host/container/private-service topology is deferred to Environment/Deployment and MUST NOT change CLEAN/fail-closed semantics.',
              'Deployment placement follows `20`: local development uses private Docker `clamd` when Phase 6 begins; the default future native server uses private same-server `clamd`. Placement MUST NOT change CLEAN/fail-closed semantics.'
          )
          text, n = re.subn(
              r'(?ms)^## 99\. Exact Details Downstream\n.*?(?=^## 100\.)',
              '''## 99. Narrow Implementation-Time Details\n\nThe following remain implementation-time details and MUST NOT be guessed before the relevant phase/evidence exists:\n\n- exact user/session/audit/schema/index implementation details where not already fixed by later authorities;\n- immutable export snapshot physical structure where not already locked by `11`;\n- exact operational numeric limiter buckets;\n- exact PDF signing library, key container/path, passphrase/secret injection, and rotation mechanism; the MVP trust model is already locked as System/Organization trust through `/ispdfvalid`, with no public-CA/Adobe-trust requirement;\n- finite ClamAV timeout/capacity tuning based on real integration evidence; placement is already defined by `20`;\n- exact private local storage roots/mounts/prefixes/permissions on the actual host;\n- LibreOffice Headless qualification outcome, required fonts, executable details, and finite renderer timeout; it is already the locked first candidate;\n- Technical Log channel/path/rotation implementation that obeys the runtime setting;\n- notification implementation if/when that future capability is approved.\n\nHA, application SLA, DR, RPO/RTO, backup architecture, load balancing, multi-server scaling, Kubernetes/orchestration, performance/load targets, external observability-platform selection, and speculative hosting topology are **not current MVP security TBDs**.\n\n''',
              text,
          )
          assert n == 1, 'Failed to replace Security downstream section'
          p.write_text(text, encoding='utf-8')

          # 14 — replace old enterprise/deployment TBD list with narrow real choices.
          p = docdir / '14_Environment_Specification.md'
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(
              r'(?ms)^## 147\. Deployment-Dependent Details\n.*?(?=^---\n\n# PART AC)',
              '''## 147. Narrow Implementation / Provisioning Choices\n\n`20_Deployment_Architecture.md` now defines the deployment posture. The following narrow choices remain intentionally implementation/provisioning-time and do **not** block ordinary local development:\n\n- actual staging/production hostnames, provider/location/IP, and supported stable/LTS Linux distro/version when a real host exists;\n- exact private persistent-storage host path/mount and permissions on that real host;\n- evidence-based worker retry/backoff/timeout values and any later worker-count tuning if a real need appears;\n- exact public-validator/login/upload rate-limit numeric buckets;\n- finite ClamAV scanner timeout selected from Phase 6 real integration behavior; topology is already local Docker `clamd` for development and private same-server `clamd` for the default future server;\n- LibreOffice Headless qualification outcome, required fonts, executable details, visual tolerance, and finite renderer timeout; LibreOffice is already the locked first candidate;\n- exact official-template operator command name;\n- exact PDF signing library, key container/path, passphrase/secret injection, and rotation mechanism; the signing trust model is already locked;\n- exact HSTS values appropriate to the actual HTTPS hostname/deployment.\n\nThese choices MUST be resolved only when their phase or real host requires them and MUST NOT be silently guessed when evidence/user approval is required.\n\nHA, application SLA, DR, RPO/RTO, backup architecture, load balancers, Kubernetes/orchestration, multi-server scaling, production load targets, and external observability-platform selection are **not current MVP environment TBDs**.\n\n''',
              text,
          )
          assert n == 1, 'Failed to replace Environment deferred section'
          p.write_text(text, encoding='utf-8')

          # 18 — synchronize DoD with completed 19/20 and removed enterprise blockers.
          p = docdir / '18_Definition_of_Done.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace('Later documents retain their future authority:', 'Later fixed-order authorities are now available and authoritative:')
          text = text.replace(
              'Examples currently still unresolved include exact renderer implementation/provider, concrete signing provider/key mechanics, selected ClamAV physical topology/timeouts, exact operational rate limits, and physical deployment details reserved for `20`.',
              'Examples that remain genuinely implementation-time include LibreOffice Headless qualification/runtime tuning, concrete signing library/key-container mechanics, finite ClamAV timeout tuning from real integration, and exact operational rate-limit numeric buckets. Deployment topology itself is already defined by `20`.'
          )
          text = text.replace(
              'Likewise, any unresolved physical/infrastructure decision from `20` that is required to safely operate the selected release blocks Production-Ready Done once that decision becomes necessary.',
              'Host-specific provisioning choices that become necessary for an actual deployment must be resolved at that time and verified against `20`; they do not block ordinary local development.'
          )
          text = text.replace('physical deployment requirements reserved for `20`.', 'physical deployment requirements defined by `20`.')
          text, n = re.subn(
              r'(?ms)^## 43\. Performance / Load / SLA Boundary\n.*?(?=^---\n\n# PART F)',
              '''## 43. Performance / Load / SLA Boundary\n\nNo numeric response-time, RPS, concurrent-user, load, application SLA, RPO, or RTO gate is a current MVP requirement. These concerns are intentionally out of current MVP scope under `19A`/`20`, not unresolved values that an agent must solve.\n\nIf a future explicit approved requirement introduces one of these targets, that target becomes an applicable DoD gate for the affected scope. A guessed industry value MUST NOT be substituted.\n\n## 44. Deployment-Specific Boundary\n\n`18` defines completion/readiness logic; `20` defines the approved deployment posture:\n\n```text\nlocal-native first\n→ Docker portability secondary\n→ default future deployment = one native Linux server\n```\n\nDo not use DoD to reintroduce HA, load balancers, DR/RPO/RTO, backup architecture, Kubernetes, multi-server scaling, application SLA/load targets, or external observability platforms as current MVP gates.\n\nNarrow real-host choices such as provider/hostname/Linux distro/storage path and evidence-based timeout/rate-limit tuning are resolved only when the corresponding implementation or deployment step actually needs them.\n\n''',
              text,
          )
          assert n == 1, 'Failed to replace DoD performance/deployment boundary'
          text, n = re.subn(
              r'(?ms)^## 59\. Current Documentation State\n.*?(?=^## 60\.)',
              '''## 59. Current Documentation State\n\nThe fixed-order documentation set is complete and **Approved for Implementation** through `20_Deployment_Architecture.md`.\n\n`18_Definition_of_Done.md` remains authoritative for completion classification; `19` is the implementation-sequencing authority and `20` is the deployment authority.\n\n''',
              text,
          )
          assert n == 1, 'Failed to replace DoD documentation state'
          text = replace_next_handoff_blocks(text)
          p.write_text(text, encoding='utf-8')

          # 19 — integrate final deployment decisions and Phase 8 candidate decisions.
          p = docdir / '19_Task_Implementation_Plan.md'
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(
              r'(?ms)^### DG-01 — Spreadsheet renderer qualification decision\n.*?(?=^### T54)',
              '''### DG-01 — LibreOffice Headless qualification gate\n\nThe first renderer candidate is already locked by `19A`/`20`:\n\n```text\nLibreOffice Headless\n```\n\nBefore T54 may be considered production-complete, Phase 8 MUST establish:\n\n- real official-workbook rendering result;\n- required fonts/runtime prerequisites;\n- finite timeout behavior based on real integration;\n- golden/fidelity qualification and approved practical visual tolerance.\n\nIf LibreOffice materially fails the required fidelity, stop and consult the user before adopting another renderer. Do not pre-build multiple renderers and do not lower fidelity requirements.\n\n### DG-02 — PDF signing implementation gate\n\nThe trust model is already locked:\n\n```text\nSystem/Organization cryptographic signer\n→ trusted/verified by NSCMF /ispdfvalid\n→ public CA / Adobe trusted-reader status not required for MVP\n```\n\nBefore T56 may be considered production-complete, Phase 8 still needs the concrete signer library/integration, key container/path, passphrase/secret injection, and rotation mechanics. Production private key material never belongs in source, ordinary DB, browser, logs/audits, or CI. Any new dependency still follows `15` approval rules.\n\n''',
              text,
          )
          assert n == 1, 'Failed to replace Phase 8 decision gates'
          text = text.replace(
              'Prepare a feature-complete codebase for deployment architecture and production-like staging validation without inventing physical topology owned by `20`.',
              'Prepare a feature-complete codebase for production-like validation and eventual server deployment under the already-approved deployment authority in `20`.'
          )
          text = text.replace(
              'Physical staging topology remains `20`.',
              'Any future staging topology follows `20`; a permanent staging server is not required for ordinary local development.'
          )
          text, n = re.subn(
              r'(?ms)^### T80 — Production readiness blockers register\n.*?(?=^### T81)',
              '''### T80 — Production readiness blockers register\n\nBefore claiming Release/Production-Ready, explicitly resolve only the real capability/provisioning items required by the release, such as:\n\n- LibreOffice Headless qualification and renderer runtime readiness;\n- concrete production signing library/key mechanism;\n- required public/login/upload rate-limit numeric values;\n- finite ClamAV timeout based on real integration;\n- actual host/provider/hostname/Linux/storage-path choices when a real server deployment is being attempted.\n\nDo **not** add HA, application SLA, DR, RPO/RTO, backup architecture, load balancers, Kubernetes, multi-server scaling, performance/load targets, or external observability platforms as current MVP blockers.\n\nNo guessed values.\n\n''',
              text,
          )
          assert n == 1, 'Failed to replace T80'
          text = text.replace(
              'Apply `18` Level 3 only after `20` supplies physical deployment authority where needed.',
              'Apply `18` Level 3 using the deployment authority already defined by `20` and the real runtime evidence required for the release.'
          )
          text = text.replace('[ ] ready to proceed to 20_Deployment_Architecture.md', '[ ] deployment/readiness assumptions align with 20_Deployment_Architecture.md')
          text = text.replace('               20 Deployment Architecture', '               future server deployment/readiness per 20')
          text, n = re.subn(
              r'(?ms)^### ClamAV\n.*?(?=^## 28\.)',
              '''### ClamAV\n\n- local development placement is private Docker `clamd` when Phase 6 begins;\n- default future server placement is private same-server `clamd` per `20`;\n- finite timeout/capacity tuning must be based on real integration evidence rather than guessed in advance.\n\n### Renderer\n\n- LibreOffice Headless is the locked first candidate;\n- Phase 8 must qualify actual fidelity, fonts, timeout, and practical tolerance;\n- if material fidelity fails, consult the user before selecting another renderer.\n\n### Signing\n\n- System/Organization signing and `/ispdfvalid` application trust are locked;\n- public CA/Adobe trusted-reader status is not required for MVP;\n- exact signer library, key container/path, passphrase injection, and rotation remain Phase 8 implementation-time security choices subject to dependency approval.\n\n### Deployment / operations\n\n`20` already resolves the current MVP deployment posture:\n\n- native-local development first;\n- Docker compatibility secondary;\n- default future deployment is one native Linux server with required runtime components co-located;\n- no load balancer/HA/Kubernetes/multi-server architecture;\n- automated CD is not current MVP.\n\nNarrow provisioning choices such as actual provider/IP/hostname, Linux distro/version, storage host path, and evidence-based timeout/rate-limit values are resolved only when the corresponding real step needs them.\n\nHA, application SLA, DR, RPO/RTO, backup architecture, performance/load targets, and external observability-platform selection are not current MVP open decisions.\n\n''',
              text,
          )
          assert n == 1, 'Failed to replace implementation open decisions'
          text = text.replace(
              'If the user explicitly chooses to begin implementation before `20`, only tasks that do not require unresolved physical deployment decisions may proceed; no production-readiness claim is allowed until `20` exists and applicable release gates are satisfied.',
              'Implementation begins only after explicit user instruction and follows the deployment authority already available in `20`; production-readiness claims still require all applicable `18` evidence.'
          )
          text = replace_next_handoff_blocks(text)
          p.write_text(text, encoding='utf-8')

          # Active synchronization addenda: remove obsolete next-document handoffs.
          p = docdir / '11A_Resumable_Attachment_Upload_Synchronization.md'
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'^> \*\*Next Fixed-Order Document:\*\*.*$', '> **Current Fixed-Order Baseline:** `01_PRD.md` through `20_Deployment_Architecture.md` — Approved for Implementation  ', text, count=1, flags=re.M)
          text = text.replace(
              'Next fixed-order document is `15_Coding_Rules_AGENTS.md`, but it MUST NOT be created until the user explicitly instructs it.',
              final_notice
          )
          p.write_text(text, encoding='utf-8')

          p = docdir / '12A_Repository_Service_Architecture_Synchronization.md'
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'^> \*\*Next Fixed-Order Document:\*\*.*$', '> **Current Fixed-Order Baseline:** `01_PRD.md` through `20_Deployment_Architecture.md` — Approved for Implementation  ', text, count=1, flags=re.M)
          p.write_text(text, encoding='utf-8')

          # Historical addenda: preserve history but remove wording that looks like a current instruction.
          p = docdir / '14A_Pre_Coding_Rules_Synchronization.md'
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'^> \*\*Current Fixed-Order Handoff:\*\*.*$', '> **Current Status:** Historical only — fixed-order documentation is complete through `20_Deployment_Architecture.md`; operational entrypoint is root `AGENTS.md`  ', text, count=1, flags=re.M)
          text = text.replace('01–15 complete as authoritative draft set', '01–15 were the then-current authoritative set (historical state; superseded by completed 01–20 baseline)')
          text = text.replace('next fixed-order document = 16_Testing_Specification.md', 'historical handoff at the time = 16_Testing_Specification.md (superseded)')
          text = text.replace('16 must wait for explicit user instruction', 'that historical creation gate was later satisfied and is no longer active')
          text, n = re.subn(
              r'(?ms)^## 18\. Next Document\n.*\Z',
              '''## 18. Historical Handoff — Superseded\n\nAt the time of this addendum, `16_Testing_Specification.md` was the next planned document. That handoff is historical and fully superseded.\n\nThe fixed-order documentation set is now complete and Approved for Implementation through `20_Deployment_Architecture.md`; current operational guidance comes from root `AGENTS.md` and the fixed-order authorities.\n''',
              text,
          )
          assert n == 1, 'Failed to replace 14A historical handoff'
          p.write_text(text, encoding='utf-8')

          p = docdir / '15A_Pre_Testing_Specification_Synchronization.md'
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'^> \*\*Next Fixed-Order Document:\*\*.*$', '> **Historical Handoff:** `17_Seed_Dummy_Data_Specification.md` was next at the time; this is superseded by the completed `01–20` baseline  ', text, count=1, flags=re.M)
          text, n = re.subn(
              r'(?ms)^## 12\. Next Fixed-Order Document\n.*\Z',
              '''## 12. Historical Handoff — Superseded\n\nAt the time of this addendum, `17_Seed_Dummy_Data_Specification.md` was the next planned document. That creation gate was later satisfied.\n\nThe fixed-order documentation set is now complete and Approved for Implementation through `20_Deployment_Architecture.md`; `16_Testing_Specification.md` remains the testing authority.\n''',
              text,
          )
          assert n == 1, 'Failed to replace 15A historical handoff'
          p.write_text(text, encoding='utf-8')

          # 19A: it now records history + still acts as synchronization, without implying current docs remain stale.
          p = docdir / '19A_Local_First_MVP_Synchronization.md'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'For the concerns explicitly covered here, this remains the newer synchronization authority over older wording in `01–19`. In particular, older references that still present HA/SLA/DR/RPO/RTO/backup/load/server-topology concerns as current TBDs or blockers are superseded.',
              'For the concerns explicitly covered here, this remains the synchronization authority that established the local-first direction later incorporated into the fixed-order baseline and `20`. Historical repository versions may contain the older HA/SLA/DR/RPO/RTO/backup/load/server-topology wording; the current approved documents must not reintroduce those concerns as MVP TBDs or blockers.'
          )
          p.write_text(text, encoding='utf-8')

          # Root AGENTS: explicitly declare the frozen approved documentation baseline.
          p = root / 'AGENTS.md'
          text = p.read_text(encoding='utf-8')
          marker = '**Deployment architecture authority:** `project_doc/20_Deployment_Architecture.md`\n'
          baseline = '**Documentation baseline:** `project_doc/01_PRD.md` through `project_doc/20_Deployment_Architecture.md` are **Approved for Implementation**; change only through explicit synchronized approval.\n'
          assert marker in text
          if baseline not in text:
              text = text.replace(marker, marker + baseline)
          p.write_text(text, encoding='utf-8')

          # Final validation across current authorities.
          fixed = sorted(docdir.glob('[0-9][0-9]_*.md'))
          for p in fixed:
              text = p.read_text(encoding='utf-8')
              statuses = re.findall(r'^> \*\*Status:\*\* (.+)$', text, flags=re.M)
              assert len(statuses) == 1 and statuses[0].strip() == 'Approved for Implementation', (p, statuses)
              assert '> **Last Updated:** 2026-09-02' in text, p

          checked = fixed + [
              docdir / '11A_Resumable_Attachment_Upload_Synchronization.md',
              docdir / '12A_Repository_Service_Architecture_Synchronization.md',
              docdir / '14A_Pre_Coding_Rules_Synchronization.md',
              docdir / '15A_Pre_Testing_Specification_Synchronization.md',
              docdir / '19A_Local_First_MVP_Synchronization.md',
              root / 'AGENTS.md',
          ]
          forbidden = [
              r'Status:\*\* Draft',
              r'upcoming `14_Environment_Specification\.md`',
              r'`14_Environment_Specification\.md` once created',
              r'`15_Coding_Rules_AGENTS\.md` once explicitly created',
              r'(?i)next fixed-order document',
              r'(?i)next document in the fixed project sequence',
              r'ready to proceed to 20_Deployment_Architecture\.md',
              r'19_Task_Implementation_Plan\.md = NOT CREATED',
              r'20_Deployment_Architecture\.md\s+= NOT CREATED',
              r'Do not create `(?:1[3-9]|20)`',
          ]
          for p in checked:
              text = p.read_text(encoding='utf-8')
              for pattern in forbidden:
                  assert not re.search(pattern, text), f'Stale pattern {pattern!r} remains in {p}'

          env = (docdir / '14_Environment_Specification.md').read_text(encoding='utf-8')
          env147 = re.search(r'(?ms)^## 147\..*?(?=^---\n\n# PART AC)', env).group(0)
          for removed in ['backup/restore/DR/RPO/RTO', 'performance/SLA/availability targets', 'external observability/log aggregation platform', 'exact production deployment topology']:
              assert removed not in env147

          plan = (docdir / '19_Task_Implementation_Plan.md').read_text(encoding='utf-8')
          assert 'Do not choose LibreOffice' not in plan
          assert 'production physical topology;' not in plan
          assert 'backup/restore/DR/RPO/RTO if required by `20`' not in plan
          assert 'Apply `18` Level 3 only after `20` supplies' not in plan

          agents = (root / 'AGENTS.md').read_text(encoding='utf-8')
          assert 'Approved for Implementation' in agents
          assert 'Phase 0' in agents and 'T00' in agents

          print('FINAL DOC FREEZE VALIDATION PASSED')
          print(f'Fixed-order docs approved: {len(fixed)}')
          PY

          git diff --check
          echo '=== FINAL CHANGED FILES ==='
          git status --short

          # Remove this one-off audit/finalizer from the final branch content.
          rm .github/workflows/docs-freeze-audit.yml
          git add AGENTS.md project_doc .github/workflows/docs-freeze-audit.yml
          git diff --cached --check

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m 'docs: freeze approved implementation baseline'
          git push origin HEAD:docs/finalize-project-documentation
