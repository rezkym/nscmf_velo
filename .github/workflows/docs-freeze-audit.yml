name: Temporary Docs Freeze Audit

on:
  push:
    branches:
      - docs/finalize-project-documentation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit project documentation finality
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FIXED-ORDER DOCS ==='
          find project_doc -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{2}_[^/]+\.md' | sort
          echo
          echo '=== STATUS HEADERS ==='
          for f in $(find project_doc -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{2}_[^/]+\.md' | sort); do
            printf '%s: ' "$f"
            grep -m1 '^> \*\*Status:\*\*' "$f" || true
          done
          echo
          echo '=== STALE TEMPORAL / HANDOFF WORDING ==='
          grep -RniE 'upcoming|once created|not created yet|do not create|must not be created until|only after explicit user instruction|next fixed-order document|current fixed-order handoff|ready to proceed to 20|before `20` existed|before `1[3-9]` existed' project_doc AGENTS.md || true
          echo
          echo '=== DRAFT WORDING ==='
          grep -RniE 'Status:\*\* Draft|authoritative draft|draft set|current draft|still draft' project_doc AGENTS.md || true
          echo
          echo '=== OLD DOCUMENT PROGRESS / NEXT-DOC REFERENCES ==='
          grep -RniE 'documentation progress|next project document|next fixed-order|fixed-order document to create|through `1[0-9]`|through:.*1[0-9]' project_doc AGENTS.md || true
          echo
          echo '=== REMOVED INFRA CONCERNS STILL PRESENT AS TBD/BLOCKER CANDIDATES ==='
          grep -RniE '(TBD|blocker|unresolved).*(HA|High Availability|SLA|DR|Disaster Recovery|RPO|RTO|backup architecture|load balancer|Kubernetes|multi-server|performance/load target)|(HA|High Availability|DR|Disaster Recovery|RPO|RTO|backup architecture|load balancer|Kubernetes|multi-server|performance/load target).*(TBD|blocker|unresolved)' project_doc AGENTS.md || true
          echo
          echo '=== ROOT AGENTS HANDOFF ==='
          grep -nE 'Current Handoff|fixed-order documentation|Phase 0|T00|Do not begin coding' AGENTS.md || true
