name: Temporary Run Final Documentation Consistency

on:
  push:
    branches:
      - docs/finalize-project-documentation

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run consistency script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/docs-final-consistency-fix.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'PY')
          block = src[start + 1:end]
          first = next(line for line in block if line.strip())
          indent = len(first) - len(first.lstrip())
          prefix = ' ' * indent
          script = '\n'.join(line[indent:] if line.startswith(prefix) else line for line in block) + '\n'
          Path('/tmp/docs_final_consistency.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/docs_final_consistency.py
          git add AGENTS.md project_doc
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m 'docs: finalize cross-document consistency'
          git push origin HEAD:docs/finalize-project-documentation
