name: Temporary Security Sync Executor

on:
  push:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute staged synchronization steps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('.github/workflows/temporary-security-doc-sync.yml')
          text = path.read_text().splitlines()

          def extract(name):
              marker = f'      - name: {name}'
              start = text.index(marker)
              run_idx = start + 1
              while run_idx < len(text) and text[run_idx].strip() != 'run: |':
                  run_idx += 1
              if run_idx >= len(text):
                  raise SystemExit(f'run block not found for {name}')
              out = []
              i = run_idx + 1
              while i < len(text):
                  line = text[i]
                  if line.startswith('      - name:'):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif line.strip() == '':
                      out.append('')
                  else:
                      raise SystemExit(f'unexpected indentation at line {i+1}: {line!r}')
                  i += 1
              return '\n'.join(out) + '\n'

          scripts = [
              extract('Synchronize existing project documents first'),
              extract('Create 10 Security Rules only after existing docs are synchronized'),
          ]

          for idx, script in enumerate(scripts, 1):
              print(f'Executing staged script {idx}...')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
