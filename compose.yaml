# Local development infrastructure only. The Laravel application itself runs natively.
name: nscmf_velo

services:
    mysql:
        image: mysql:8.4
        container_name: nscmf_mysql
        restart: unless-stopped
        ports:
            - '${DB_PORT:-3306}:3306'
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:-nscmf}'
            MYSQL_USER: '${DB_USERNAME:-nscmf}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
        volumes:
            - nscmf_mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    nscmf_mysql_data:
